services:
  postgres:
    image: postgres:17-alpine
    container_name: nexrig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexrig
      POSTGRES_USER: nexrig
      POSTGRES_PASSWORD: nexrig_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nexrig_postgres_data:/var/lib/postgresql/data
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexrig -d nexrig"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  nexrig_postgres_data:
